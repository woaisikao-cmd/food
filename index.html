  /* ============================================================
     底部抽屉（探过的铺子）：点击把手展开 / 收起
     原理：抽屉高度用的是 CSS 变量 --sheet-h（默认 30vh = 占屏幕 30%）。
     拖着「把手」或「标题栏」往上/往下滑，就实时改这个变量，
     抽屉变高（露出更多店铺）或变矮；手一松自动吸到最近的档位。
     展开的最大高度 = 「搜索框的下沿」：抽屉只盖地图，不盖搜索框，
     所以滑到顶时，抽屉顶边刚好停在搜索框下面。
     ============================================================ */
  var SHEET_H_MIN = 30; // 收起档（占屏幕%）
  function sheetMaxVh(){
    // 搜索框下沿离屏幕顶部的像素 → 换算成「抽屉最多占屏幕百分之几」
    var fc = $('filterCard');
    var bottom = fc ? fc.getBoundingClientRect().bottom : 140;
    var vh = (window.innerHeight - bottom - 6) / window.innerHeight * 100;
    return Math.max(SHEET_H_MIN + 5, Math.min(84, vh));
  }
  function initSheetDrag(){
    var sheet = $('shopSheet'), tip = $('sheetTip');
    var dragState = null; // null=没在拖；否则 {startY, startVh}

    // 抽屉当前高度（%）：从 CSS 变量里读出来
    function curVh(){
      var v = getComputedStyle(document.documentElement).getPropertyValue('--sheet-h');
      return parseFloat(v) || SHEET_H_MIN;
    }
    // 设定抽屉高度（%）
    function setVh(v){
      document.documentElement.style.setProperty('--sheet-h', Math.round(v) + 'vh');
    }

    function begin(y, curVhVal){
      dragState = { startY: y, startVh: curVhVal, moved: 0 };
      sheet.classList.add('dragging'); // 拖拽中取消过渡动画，手放哪停哪
    }
    function move(y){
      if(!dragState) return;
      dragState.moved += Math.abs(y - dragState.startY); // 累计手指走过的距离
      var v = dragState.startVh - (y - dragState.startY) / window.innerHeight * 100;
      // 限制在最小档～搜索框下沿档之间，拖不出界
      var maxVh = sheetMaxVh();
      v = Math.max(SHEET_H_MIN - 2, Math.min(maxVh + 2, v));
      setVh(v);
    }
    function end(){
      if(!dragState) return;
      sheet.classList.remove('dragging'); // 恢复过渡动画
      var v = curVh();
      var maxVh = sheetMaxVh();
      // 手指几乎没动（< 10px）= 只是点了一下把手 → 直接展开/收起切换
      if(dragState.moved < 10){
        v = (v >= maxVh - 1) ? SHEET_H_MIN : maxVh; // 当前展开就收起，否则展开
      } else {
        // 拖过中位线就算想「看更多」，吸到搜索框下沿档；否则收回去
        var halfway = (SHEET_H_MIN + maxVh) / 2;
        v = v >= halfway ? maxVh : SHEET_H_MIN;
      }
      setVh(v);
      tip.textContent = v >= maxVh - 1 ? '点击收起' : '点击展开';
      dragState = null;
    }

    // 把手 + 标题栏 = 拖拽区（列表区域保持正常滚动，互不打架）
    var zone = $('sheetGrab');
    zone.addEventListener('touchstart', function(e){
      begin(e.touches[0].clientY, curVh());
    }, { passive: true });
    zone.addEventListener('touchmove', function(e){
      move(e.touches[0].clientY);
      e.preventDefault(); // 防止抽屉跟着页面滚动
    }, { passive: false });
    zone.addEventListener('touchend', end);
    zone.addEventListener('touchcancel', end);
    $('sheetHead').addEventListener('touchstart', function(e){
      begin(e.touches[0].clientY, curVh());
    }, { passive: true });
    $('sheetHead').addEventListener('touchmove', function(e){
      move(e.touches[0].clientY);
      e.preventDefault();
    }, { passive: false });
    $('sheetHead').addEventListener('touchend', end);
    $('sheetHead').addEventListener('touchcancel', end);

    // 电脑预览也能玩：鼠标按住拖
    // 关键防抖：手机上触摸结束后浏览器会补发合成的 mousedown/mouseup，
    // 不挡住的话会再触发一次「点按切换」→ 抽屉刚弹开就被收回去（弹一下又缩回的根因）
    var lastTouchEnd = 0;
    var mouseDown = false;
    zone.addEventListener('touchend', function(){ lastTouchEnd = Date.now(); });
    zone.addEventListener('touchcancel', function(){ lastTouchEnd = Date.now(); });
    $('sheetHead').addEventListener('touchend', function(){ lastTouchEnd = Date.now(); });
    $('sheetHead').addEventListener('touchcancel', function(){ lastTouchEnd = Date.now(); });
    zone.addEventListener('mousedown', function(e){
      if(Date.now() - lastTouchEnd < 700) return; // 刚摸过就忽略合成鼠标事件
      mouseDown = true; begin(e.clientY, curVh());
    });
    document.addEventListener('mousemove', function(e){ if(mouseDown) move(e.clientY); });
    document.addEventListener('mouseup', function(){ if(mouseDown){ mouseDown = false; end(); } });
    $('sheetHead').addEventListener('mousedown', function(e){
      if(Date.now() - lastTouchEnd < 700) return;
      mouseDown = true; begin(e.clientY, curVh());
    });
  }

  /* ---------- 收回抽屉（供点击搜索框等场景调用） ---------- */
  /* 如果「探过的铺子」抽屉正展开（挡住地图），把它收回原位，
     不然用户点搜索框输入时，地图被抽屉盖着看不见搜索结果。 */
  function collapseSheetIfOpen(){
    var v = getComputedStyle(document.documentElement).getPropertyValue('--sheet-h');
    var cur = parseFloat(v) || SHEET_H_MIN;
    if(cur > SHEET_H_MIN + 3){ // 只有抽屉明显展开时才收回
      document.documentElement.style.setProperty('--sheet-h', SHEET_H_MIN + 'vh');
      var tip = $('sheetTip');
      if(tip) tip.textContent = '点击展开';
    }
  }

  /* ---------- 自动展开抽屉（挑一挑选完后调用） ---------- */
  /* 把「探过的铺子」抽屉直接滑到最高档（搜索框下沿），
     让用户挑完筛选条件回到首页时，一眼看到筛选后的完整店铺名单。
     和上面的 collapseSheetIfOpen() 是一对：一个收回、一个展开。 */
  function expandSheet(){
    var maxVh = sheetMaxVh();
    document.documentElement.style.setProperty('--sheet-h', Math.round(maxVh) + 'vh');
    var tip = $('sheetTip');
    if(tip) tip.textContent = '点击收起'; // 把手上的提示文字同步换掉
  }

  function setBrandHead(avaId, nameId){
    var a = $(avaId);
    if(a){
      if(BINFO.avatar){ a.innerHTML = '<img src="' + esc(BINFO.avatar) + '" alt="博主头像">'; }
      else { a.textContent = '👩‍🍳'; }
    }
    var n = $(nameId); if(n) n.textContent = String(BINFO.siteName || BINFO.name || '探店博主');
  }

  /* ---------- 启动 ---------- */
  function boot(){
    // 8 秒还没开门（数据/地图脚本加载慢，更新后首次访问尤其明显）：
    // 把状态文字换成更明确的提示，安抚等待的用户
    _doorSlowT = setTimeout(function(){
      if($('doors') && !$('doors').classList.contains('open')){
        var st = $('doorStatus');
        if(st) st.textContent = '上菜有点慢…首次访问会更慢，关掉本页再点一次网址试试';
      }
    }, 8000);
    // 站点标题：博主后台自定义 > config.js 默认
    var siteName = String(BINFO.siteName || BINFO.name || CFG.BLOG_NAME || '探店·美食地图');
    document.title = siteName;
    $('blogName').innerHTML = esc(siteName).replace('·', '<b>·</b>');

    // 顶栏头像：博主头像（无图回退 🍙）
    var logo = $('brandLogo');
    if(BINFO.avatar){ logo.innerHTML = '<img src="' + esc(BINFO.avatar) + '" alt="博主头像">'; }
    else { logo.textContent = '🍙'; }
    // 博主主页 / 收藏页顶栏：统一填品牌头像 + 站点名（与首页同款）
    setBrandHead('bPageLogo', 'bPageName');
    setBrandHead('fPageLogo', 'fPageName');

    // 底部抽屉支持点击展开/收起 + 拖拽
    initSheetDrag();

    // 事件绑定
    $('btnLocate').onclick = locate;
    $('searchInput').oninput = function(){ state.kw = this.value; applyFilter(); };
    // 点击搜索框准备输入时：如果「探过的铺子」抽屉展开着，先收回它，露出地图
    // onfocus 保证键盘弹出前的标准时机；onpointerdown 双保险，手指按下瞬间就收
    $('searchInput').onfocus = function(){ collapseSheetIfOpen(); };
    $('searchInput').addEventListener('pointerdown', function(){ collapseSheetIfOpen(); });
    $('btnClear').onclick = function(){
      state.kw = ''; state.city = ''; state.district = '';
      state.category = '';
      state.scene = ''; // 场景也一起清空
      // 草稿同步清空，下次打开弹窗看到的就和列表一致
      pendingPick = { category:'', sort:'distance', scene:'' };
      updateLocButton();
      setChipOn('catOpts', 'data-cat', '');
      setChipOn('sceneOpts', 'data-scene', '');
      $('searchInput').value = '';
      applyFilter();
    };
    $('btnFilter').onclick = openPanel;
    $('panelMask').onclick = closePanel;
    // 顶栏「地点」按钮：打开 省份→城市→区域 三级联动弹层
    $('locSelect').onclick = openLocPicker;
    $('locMask').onclick = closeLocPicker;
    $('locDone').onclick = applyLocPick;
    /* 挑完后的节奏：弹窗先滑下去 → 等它退场动画播完（约 0.4 秒）→ 抽屉再上滑。
       expandTimer 用来记录这个"稍后再滑"的定时器：
       如果用户手快连点了，先清掉上一次的等待，避免抽屉反复上下跳。 */
    var expandTimer = null;
    function closeThenExpand(){
      closePanel();
      if(expandTimer) clearTimeout(expandTimer);
      expandTimer = setTimeout(function(){
        expandTimer = null;
        expandSheet();
      }, 400); // 400ms ≈ 弹窗下滑动画 .38s + 一点缓冲
    }
    $('panelDone').onclick = function(){
      // 点「好啦，就这样看！」才把弹窗里的草稿真正应用到列表
      state.category = pendingPick.category;
      state.sort = pendingPick.sort;
      state.scene = pendingPick.scene;
      applyFilter();
      closeThenExpand(); // 弹窗先滑走，等它退场后抽屉再自动上滑
    };
    $('nearChip').onclick = function(){ state.nearby = false; applyFilter(); };
    // 店铺列表翻页（上一页 / 下一页）
    $('pagerPrev').onclick = function(){ if(state.page > 1){ state.page--; renderList(); } };
    $('pagerNext').onclick = function(){ if(state.page < Math.ceil(filtered.length / PAGE_SIZE)){ state.page++; renderList(); } };
    // 返回地图：底部 Tab 的「地图」按钮已提供，无需顶栏返回键
    Array.prototype.forEach.call(document.querySelectorAll('#viewBlogger .sort-chip[data-sort]'), function(el){
      el.onclick = function(){
        state.bloggerSort = el.getAttribute('data-sort');
        Array.prototype.forEach.call(document.querySelectorAll('#viewBlogger .sort-chip[data-sort]'), function(x){
          x.classList.toggle('on', x === el);
        });
        renderBloggerGrid();
      };
    });
    Array.prototype.forEach.call($('sortOpts').querySelectorAll('.opt-chip'), function(el){
      el.onclick = function(){
        // 只改草稿、只换高亮，不马上筛选——等「好啦，就这样看！」统一生效
        pendingPick.sort = el.getAttribute('data-sort');
        setChipOn('sortOpts', 'data-sort', pendingPick.sort);
        el.classList.add('pop');
      };
    });
    // 什么场合（单选）：同样只改草稿，点「好啦」才生效
    Array.prototype.forEach.call($('sceneOpts').querySelectorAll('.opt-chip'), function(el){
      el.onclick = function(){
        pendingPick.scene = el.getAttribute('data-scene');
        setChipOn('sceneOpts', 'data-scene', pendingPick.scene);
        el.classList.add('pop');
      };
    });
    Array.prototype.forEach.call($('tabbar').querySelectorAll('.tab'), function(el){
      el.onclick = function(){ switchTab(el.getAttribute('data-tab')); };
    });
    updateFavDot();

    var noKey = !CFG.AMAP_KEY || CFG.AMAP_KEY === '你的高德Key';

    loadShops().then(function(){
      // 数据加载完成后：把已经失效的收藏（博主已删的店铺）清掉，再刷新角标数字
      cleanDeadFavs();
      updateFavDot();
      if(noKey){
        fallbackMode();
        buildFilters();
        applyFilter();
        setStatus('等 Key 中…');
        setTimeout(openDoors, 450);
        return;
      }
      if(CFG.SECURITY_JSCODE){
        window._AMapSecurityConfig = { securityJsCode: CFG.SECURITY_JSCODE };
      }
      setStatus('铺地图中…');
      var api = document.createElement('script');
      api.src = 'https://webapi.amap.com/maps?v=2.0&key=' + encodeURIComponent(CFG.AMAP_KEY);
      api.onload = function(){
        if(!window.AMap){ fallbackMode(); }
        else if(!initMap()){ fallbackMode(); }
        buildFilters();
        applyFilter();
        if(mapReady && shops.length){
          map.setFitView(markerObjs, false, FIT_AVOID); // 首屏先取景：所有店铺图钉都框进来
          autoDetectCity(); // 随后自动定位用户所在城市，切到「用户的城市」视角
        }
        setStatus('欢迎光临！');
        setTimeout(openDoors, 350);
      };
      api.onerror = function(){
        fallbackMode();
        buildFilters();
        applyFilter();
        setStatus('离线模式');
        setTimeout(openDoors, 450);
        setTimeout(function(){ toast('地图脚本没加载出来，检查网络后刷新即可'); }, 1800);
      };
      document.head.appendChild(api);
    }).catch(function(){
      showDoorError('数据没上桌',
        '店铺数据 data/shops.js 没找到。<br>如果刚从管理面板导出，记得上传到仓库后刷新。<code>data/shops.js 读取失败</code>');
    });
  }

  boot();
})();
</script>
</body>
</html>
